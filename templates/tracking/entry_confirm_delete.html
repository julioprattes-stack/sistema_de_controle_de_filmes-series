{% extends "base.html" %}
{% block title %}Excluir registro{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Excluir registro</h1>

    <div class="alert alert-warning">
      Tem certeza que quer remover <strong>{{ object.title.name }}</strong> da sua lista?
      O título continua no catálogo.
    </div>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sim, excluir</button>
      <a href="{% url 'tracking:entry_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
